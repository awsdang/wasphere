services:

  # ────────────────────────────────────────────────────────────────────────────
  # PostgreSQL
  # ────────────────────────────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped

    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}

    volumes:
      - wa-postgres:/var/lib/postgresql/data

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s


  # ────────────────────────────────────────────────────────────────────────────
  # Dashboard API
  # ────────────────────────────────────────────────────────────────────────────
  dashboard-api:
    build:
      context: .
      dockerfile: packages/dashboard-api/Dockerfile

    restart: unless-stopped

    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}

      JWT_SECRET: ${JWT_SECRET}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY}
      INTERNAL_WEBHOOK_SECRET: ${INTERNAL_WEBHOOK_SECRET}

      CORS_ORIGIN: ${DASHBOARD_UI_URL}
      DASHBOARD_UI_URL: ${DASHBOARD_UI_URL}

      DASHBOARD_PORT: "3000"

      # Public API URL used for webhook media download links.
      MEDIA_BASE_URL: ${MEDIA_BASE_URL}

      # SMTP / Email
      # Leave SMTP_HOST blank to disable email.
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_FROM: ${SMTP_FROM:-}

      NODE_ENV: production

    depends_on:
      postgres:
        condition: service_healthy

    expose:
      - "3000"

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget -qO- http://localhost:3000/health || exit 1"
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 40s


  # ────────────────────────────────────────────────────────────────────────────
  # WhatsApp Server
  # ────────────────────────────────────────────────────────────────────────────
  wa-server:
    build:
      context: .
      dockerfile: packages/wa-server/Dockerfile

    restart: unless-stopped

    environment:
      WA_TOKEN: ${WA_TOKEN}

      PORT: "3001"

      CORS_ORIGIN: ${DASHBOARD_UI_URL}

      WEBHOOK_SIGNING_SECRET: ${WEBHOOK_SIGNING_SECRET}

      AUDIT_DASHBOARD_URL: http://dashboard-api:3000/internal/audit
      INTERNAL_WEBHOOK_SECRET: ${INTERNAL_WEBHOOK_SECRET}

      # Normally leave blank.
      # Dashboard registers its callback automatically.
      DASHBOARD_WEBHOOK_URL: ${DASHBOARD_WEBHOOK_URL:-}

      # Meta WhatsApp Cloud API
      META_PROVIDER_ENABLED: ${META_PROVIDER_ENABLED:-false}
      GRAPH_VERSION: ${GRAPH_VERSION:-v22.0}

      NODE_ENV: production

    volumes:
      - wa-sessions:/app/sessions

    depends_on:
      dashboard-api:
        condition: service_healthy

    expose:
      - "3001"

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget -qO- http://localhost:3001/api/health/live || exit 1"
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
                
  # ────────────────────────────────────────────────────────────────────────────
  # Dashboard UI
  # ────────────────────────────────────────────────────────────────────────────
  dashboard-ui:
    build:
      context: .
      dockerfile: packages/dashboard-ui/Dockerfile

    restart: unless-stopped

    environment:
      # Internal Docker service URLs
      DASHBOARD_API_URL: http://dashboard-api:3000
      WA_SERVER_INTERNAL_URL: http://wa-server:3001

      # Public URL used when generating/configuring Meta webhook callback.
      WA_SERVER_PUBLIC_URL: ${WA_SERVER_PUBLIC_URL}

      NODE_ENV: production

    depends_on:
      dashboard-api:
        condition: service_healthy

    expose:
      - "3004"

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget -qO- http://localhost:3004/login || exit 1"
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s


# ──────────────────────────────────────────────────────────────────────────────
# Persistent Data
# ──────────────────────────────────────────────────────────────────────────────
volumes:

  # PostgreSQL database
  wa-postgres:
    driver: local

  # WhatsApp sessions
  wa-sessions:
    driver: local
